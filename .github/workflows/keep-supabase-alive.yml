name: Keep Supabase project alive

# Supabase pausa proyectos free-tier después de 7 días sin actividad.
# Este workflow le hace un pedido de lectura liviano a la API cada 2
# días (margen de sobra) para que el proyecto nunca se pause.
#
# La "anon key" usada acá es la misma que ya vive en el código público
# del sitio (assets/js/supabase-client.js) — está diseñada para ser
# pública, protegida por las políticas de RLS, así que no hay problema
# en tenerla en este archivo también.

on:
  schedule:
    - cron: "0 9 */2 * *" # cada 2 días, 9am UTC
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "https://jcsmbklwsgzsohqkftfy.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impjc21ia2x3c2d6c29ocWtmdGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjc4MjUsImV4cCI6MjEwMTYwMzgyNX0.cx-XdztGsNP07xFpdWYxFQIbevOh0EWzRpqQD5p3LkI"
          echo "Ping OK — $(date -u)"

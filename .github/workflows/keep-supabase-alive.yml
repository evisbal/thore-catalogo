name: Keep Supabase project alive

# Supabase pausa proyectos free-tier después de 7 días sin actividad.
# Este workflow actualiza una fila "heartbeat" cada 2 días (margen de
# sobra) para que el proyecto nunca se pause.
#
# Antes esto era un simple SELECT de lectura — corrió sin fallar
# durante semanas y el proyecto se pausó igual, así que un read
# anónimo no cuenta como "actividad" para Supabase. Este UPDATE sí
# escribe de verdad en la base (ver supabase/schema.sql, tabla
# heartbeat).
#
# La "anon key" usada acá es la misma que ya vive en el código público
# del sitio (assets/js/supabase-client.js) — está diseñada para ser
# pública, protegida por las políticas de RLS, así que no hay problema
# en tenerla en este archivo también.

on:
  schedule:
    - cron: "0 9 */2 * *" # cada 2 días, 9am UTC
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Update heartbeat row in Supabase
        run: |
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impjc21ia2x3c2d6c29ocWtmdGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjc4MjUsImV4cCI6MjEwMTYwMzgyNX0.cx-XdztGsNP07xFpdWYxFQIbevOh0EWzRpqQD5p3LkI"
          curl -sf -X PATCH "https://jcsmbklwsgzsohqkftfy.supabase.co/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
          echo "Heartbeat updated OK — $(date -u)"
